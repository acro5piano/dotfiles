onboarding = false

[keys]
prefix = "ctrl+t"
new_tab = "alt+o"
new_workspace = "alt+ctrl+o"
new_worktree = "ctrl+shift+b"
goto = "ctrl+space"
split_vertical = "alt+/"
split_horizontal = "alt+minus"
previous_tab = "alt+p"
next_tab = "alt+n"
previous_workspace = "ctrl+alt+p"
next_workspace = "ctrl+alt+n"
previous_agent = "ctrl+alt+k"
next_agent = "ctrl+alt+j"
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
copy_mode = ["alt+["]
resize_pane_left = ["alt+left"]
resize_pane_down = ["alt+down"]
resize_pane_up = ["alt+up"]
resize_pane_right = ["alt+right"]
zoom = "alt+z"
edit_scrollback = "prefix+ctrl+e"

[ui]
prompt_new_tab_name = false
